    <div id="page-top">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>$(function () {
            const pageTop = $('#page-top');

            // 初期状態では非表示
            pageTop.hide();

            // スクロール時の処理
            $(window).scroll(function () {
                // 100pxスクロールしたらボタンを表示
                if ($(this).scrollTop() > 100) {
                    pageTop.fadeIn(); // ふわっと表示
                } else {
                    pageTop.fadeOut(); // ふわっと非表示
                }
            });

            // ボタンクリック時の処理
            pageTop.click(function () {
                // ページトップまで500ミリ秒かけてスムーススクロール
                $('body, html').animate({
                    scrollTop: 0
                }, 500);
                return false; // aタグのデフォルト動作（一瞬でトップへ移動）をキャンセル
            });

        });</script>
